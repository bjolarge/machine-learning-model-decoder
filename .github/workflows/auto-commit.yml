name: Auto Commit

on:
  schedule:
    - cron: '0 */2 * * *' 
  workflow_dispatch:        

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update comment/file
        run: |
          echo "// Updated at $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> some-file.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M')"
          git push